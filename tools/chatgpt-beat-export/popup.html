<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beat로 내보내기</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; width: 380px; color: #1f2937; background: #fffdf8; }
      main { padding: 16px; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p { font-size: 12px; line-height: 1.5; margin: 6px 0; color: #6b7280; }
      label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 4px; }
      select, button { width: 100%; box-sizing: border-box; border: 1px solid #d6d3d1; border-radius: 8px; padding: 8px; font: inherit; }
      button { cursor: pointer; background: #292524; color: white; margin-top: 10px; }
      button:disabled { cursor: wait; opacity: .5; }
      .secondary { background: #fff; color: #292524; }
      #status { min-height: 18px; color: #92400e; }
      #session-status { min-height: 18px; color: #57534e; font-size: 12px; }
      #session-status.ready { color: #166534; }
      #session-status.error { color: #b91c1c; }
      .group { border-top: 1px solid #e7e5e4; padding: 10px 0; }
      .group-title { font-size: 12px; font-weight: 600; }
      .group-text { white-space: pre-wrap; max-height: 58px; overflow: hidden; font-size: 11px; color: #57534e; margin: 4px 0; }
      .thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .image-card { position: relative; display: grid; gap: 4px; padding: 4px; border: 1px solid #d6d3d1; border-radius: 8px; background: #fff; cursor: pointer; }
      .image-card:has(input:checked) { border-color: #c2410c; box-shadow: 0 0 0 1px #c2410c; }
      .image-card input { position: absolute; z-index: 1; top: 7px; left: 7px; width: 16px; height: 16px; accent-color: #c2410c; }
      .image-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; }
      .image-card span { font-size: 10px; color: #57534e; text-align: center; }
      .hidden { display: none; }
      .muted { color: #78716c; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Beat Gourmet로 내보내기</h1>
      <p>현재 ChatGPT 대화의 사진을 기존 Beat 초안에 연결합니다. 사진을 미리 확인하고 선택한 것만 WebP로 최적화해 저장합니다.</p>
      <div id="session-status" role="status">Beat Admin 로그인 상태를 확인하는 중입니다…</div>
      <button id="check-session" class="secondary" type="button">관리자 로그인 상태 확인</button>
      <div id="status" role="status"></div>
      <button id="extract" class="secondary" type="button">현재 대화의 사진 찾기</button>
      <section id="results" class="hidden">
        <p id="summary"></p>
        <div id="groups"></div>
        <button id="export" type="button" disabled>확인한 사진을 초안에 연결</button>
      </section>
      <p class="muted">Beat 관리자 화면을 같은 브라우저 탭에 열고 로그인한 상태여야 합니다.</p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
