name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-github-pages.yml"
      - "apps/web/**"
      - "packages/env/**"
      - "packages/tailwind-config/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tooling/github/setup/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: beat-github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    env:
      BEAT_RUNTIME_SECRET_ARN: ${{ vars.BEAT_RUNTIME_SECRET_ARN }}
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_SITE_URL: https://arlequins.github.io/beat
      NEXT_PUBLIC_BEAT_APP_URL: ${{ vars.NEXT_PUBLIC_BEAT_APP_URL }}
      SST_AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - name: Build API SST workspace dependencies
        run: pnpm turbo run build --filter=@arlequins/api...
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - name: Resolve deployed public API URL
        id: api
        run: |
          state_file="$RUNNER_TEMP/beat-api-sst-state.json"
          trap 'rm -f "$state_file"' EXIT
          SST_TELEMETRY_DISABLED=1 pnpm --silent --filter @arlequins/api with-env sst state export --stage production > "$state_file"
          API_URL="$(node scripts/read-sst-output.mjs "$state_file" apiUrl)"
          node -e 'const url = new URL(process.argv[1]); if (url.protocol !== "https:") throw new Error("Production API endpoint must use HTTPS");' "$API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "NEXT_PUBLIC_API_URL=$API_URL" >> "$GITHUB_ENV"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static web application
        run: pnpm turbo run build --filter=@arlequins/web...
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
