name: Production availability monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: beat-production-availability-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      api_url: ${{ steps.urls.outputs.api_url }}
      web_url: ${{ steps.urls.outputs.web_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - name: Build SST workspace dependencies
        run: pnpm turbo run build --filter=@acme/web... --filter=@acme/api...
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - name: Resolve public endpoints without exporting secrets
        id: urls
        run: |
          web_state="$RUNNER_TEMP/beat-web-sst-state.json"
          api_state="$RUNNER_TEMP/beat-api-sst-state.json"
          trap 'rm -f "$web_state" "$api_state"' EXIT
          SST_TELEMETRY_DISABLED=1 pnpm --silent --filter @acme/web with-env sst state export --stage production > "$web_state"
          SST_TELEMETRY_DISABLED=1 pnpm --silent --filter @acme/api with-env sst state export --stage production > "$api_state"
          WEB_URL="$(node scripts/read-sst-output.mjs "$web_state" webUrl)"
          API_URL="$(node scripts/read-sst-output.mjs "$api_state" apiUrl)"
          node -e 'for (const value of process.argv.slice(1)) { const url = new URL(value); if (url.protocol !== "https:") throw new Error("Production endpoint must use HTTPS"); }' "$WEB_URL" "$API_URL"
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: Check public website
        run: curl --fail --silent --show-error --location --retry 2 "${{ steps.urls.outputs.web_url }}"
      - name: Check public API
        run: node scripts/smoke-api.mjs "${{ steps.urls.outputs.api_url }}"

  report-failure:
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open one actionable GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Production availability monitor failed"
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')"
          if test -z "$existing"; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The hourly protected monitor could not reach a public Beat endpoint. Review the failed run: $RUN_URL"
          fi
