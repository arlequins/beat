name: Deploy SST application

on:
  workflow_call:
    inputs:
      application:
        description: Workspace to deploy
        required: true
        type: string
      environment:
        description: GitHub environment and SST stage
        required: true
        type: string
      operation:
        description: deploy or remove
        required: true
        type: string
      role_arn:
        description: AWS IAM role assumed through GitHub OIDC
        required: true
        type: string
      runtime_secret_id:
        description: Optional AWS Secrets Manager JSON secret for an API deployment
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: sst-${{ inputs.environment }}-${{ inputs.application }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Validate operation
        run: test "${{ inputs.operation }}" = deploy || test "${{ inputs.operation }}" = remove

      - name: Require Beat production runtime secret
        if: inputs.application == 'api' && inputs.operation == 'deploy'
        env:
          RUNTIME_SECRET_ID: ${{ inputs.runtime_secret_id }}
        run: test -n "$RUNTIME_SECRET_ID"

      - name: Load API runtime configuration from Secrets Manager
        if: inputs.application == 'api' && inputs.operation == 'deploy' && inputs.runtime_secret_id != ''
        env:
          RUNTIME_SECRET_ID: ${{ inputs.runtime_secret_id }}
        run: |
          secret_file="$RUNNER_TEMP/beat-api-runtime.json"
          umask 077
          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_ID" \
            --query SecretString \
            --output text > "$secret_file"
          BEAT_RUNTIME_SECRET_FILE="$secret_file" \
          BEAT_GITHUB_ENV_FILE="$GITHUB_ENV" \
          node scripts/validate-beat-runtime-secret.mjs

      - name: Run SST operation
        run: pnpm sst:ws ${{ inputs.application }} ${{ inputs.operation }} -- --stage ${{ inputs.environment }}

      - name: Smoke production API
        if: inputs.application == 'api' && inputs.environment == 'production' && inputs.operation == 'deploy'
        env:
          API_URL: ${{ vars.BEAT_PRODUCTION_API_URL }}
        run: |
          test -n "$API_URL"
          node -e 'const url = new URL(process.argv[1]); if (url.protocol !== "https:") throw new Error("Production smoke endpoint must use HTTPS");' "$API_URL"
          node scripts/smoke-api.mjs "${API_URL%/}"
