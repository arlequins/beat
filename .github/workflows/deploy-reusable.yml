name: Deploy SST application

on:
  workflow_call:
    outputs:
      api_url:
        description: API URL emitted by a successful API deployment
        value: ${{ jobs.deploy.outputs.api_url }}
      web_url:
        description: Web URL emitted by a successful web deployment
        value: ${{ jobs.deploy.outputs.web_url }}
    inputs:
      application:
        description: Workspace to deploy
        required: true
        type: string
      environment:
        description: Must be the sole GitHub Environment and SST stage, production
        required: true
        type: string
      operation:
        description: diff, deploy, or remove
        required: true
        type: string
      bootstrap_api:
        description: One-time API infrastructure deploy before the runtime secret exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      api_url: ${{ steps.deployed-api.outputs.api_url }}
      web_url: ${{ steps.deployed-web.outputs.web_url }}
    env:
      SST_AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
      BEAT_RUNTIME_SECRET_ARN: ${{ vars.BEAT_RUNTIME_SECRET_ARN }}
    concurrency:
      group: sst-production-${{ inputs.application }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup

      - name: Build application workspace dependencies
        run: pnpm turbo run build --filter="@acme/${{ inputs.application }}^..."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.SST_AWS_REGION }}

      - name: Validate operation
        run: |
          test "${{ inputs.environment }}" = production
          test "${{ inputs.operation }}" = diff || \
          test "${{ inputs.operation }}" = deploy || \
          test "${{ inputs.operation }}" = remove
          if test "${{ inputs.bootstrap_api }}" = true; then
            test "${{ inputs.application }}" = api
            test "${{ inputs.environment }}" = production
            test "${{ inputs.operation }}" = deploy
          fi

      - name: Require Beat production runtime secret
        if: inputs.environment == 'production' && inputs.application == 'api' && inputs.operation != 'remove'
        env:
          RUNTIME_SECRET_ARN: ${{ env.BEAT_RUNTIME_SECRET_ARN }}
        run: |
          test -n "$RUNTIME_SECRET_ARN"
          case "$RUNTIME_SECRET_ARN" in arn:aws:secretsmanager:*) ;; *) exit 1 ;; esac

      - name: Validate API runtime secret without exporting it
        if: inputs.environment == 'production' && inputs.application == 'api' && inputs.operation == 'deploy' && !inputs.bootstrap_api
        env:
          RUNTIME_SECRET_ARN: ${{ env.BEAT_RUNTIME_SECRET_ARN }}
        run: |
          secret_file="$RUNNER_TEMP/beat-api-runtime.json"
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_ARN" \
            --query SecretString \
            --output text > "$secret_file"
          BEAT_RUNTIME_SECRET_FILE="$secret_file" \
          node scripts/validate-beat-runtime-secret.mjs

      - name: Run SST operation
        env:
          BEAT_RUNTIME_SECRET_ARN: ${{ env.BEAT_RUNTIME_SECRET_ARN }}
        run: |
          if test "${{ inputs.operation }}" = diff; then
            set -o pipefail
            pnpm sst:ws ${{ inputs.application }} diff -- --stage ${{ inputs.environment }} --print-logs | tee "$RUNNER_TEMP/sst-diff.txt"
          else
            pnpm sst:ws ${{ inputs.application }} ${{ inputs.operation }} -- --stage ${{ inputs.environment }} --print-logs
          fi

      - name: Save reviewed SST diff
        if: inputs.operation == 'diff'
        uses: actions/upload-artifact@v4
        with:
          name: sst-diff-${{ inputs.application }}-${{ github.sha }}
          path: ${{ runner.temp }}/sst-diff.txt
          if-no-files-found: error

      - name: Resolve deployed API URL from SST state
        id: deployed-api
        if: inputs.application == 'api' && inputs.environment == 'production' && inputs.operation == 'deploy'
        env:
          BEAT_RUNTIME_SECRET_ARN: ${{ env.BEAT_RUNTIME_SECRET_ARN }}
        run: |
          state_file="$RUNNER_TEMP/beat-api-sst-state.json"
          trap 'rm -f "$state_file"' EXIT
          SST_TELEMETRY_DISABLED=1 pnpm --silent --filter @acme/api with-env sst state export --stage production > "$state_file"
          API_URL="$(node scripts/read-sst-output.mjs "$state_file" apiUrl)"
          node -e 'const url = new URL(process.argv[1]); if (url.protocol !== "https:") throw new Error("Production smoke endpoint must use HTTPS");' "$API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "### API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$API_URL\`" >> "$GITHUB_STEP_SUMMARY"
          if test "${{ inputs.bootstrap_api }}" = true; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Runtime-secret validation and smoke testing are deferred until the secret is initialized." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve deployed web URL from SST state
        id: deployed-web
        if: inputs.application == 'web' && inputs.environment == 'production' && inputs.operation == 'deploy'
        run: |
          state_file="$RUNNER_TEMP/beat-web-sst-state.json"
          trap 'rm -f "$state_file"' EXIT
          SST_TELEMETRY_DISABLED=1 pnpm --silent --filter @acme/web with-env sst state export --stage production > "$state_file"
          WEB_URL="$(node scripts/read-sst-output.mjs "$state_file" webUrl)"
          node -e 'const url = new URL(process.argv[1]); if (url.protocol !== "https:") throw new Error("Production web endpoint must use HTTPS");' "$WEB_URL"
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "### Web deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$WEB_URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke production API
        if: inputs.application == 'api' && inputs.environment == 'production' && inputs.operation == 'deploy' && !inputs.bootstrap_api
        env:
          API_URL: ${{ steps.deployed-api.outputs.api_url }}
        run: |
          node -e 'const url = new URL(process.argv[1]); if (url.protocol !== "https:") throw new Error("Production smoke endpoint must use HTTPS");' "$API_URL"
          node scripts/smoke-api.mjs "${API_URL%/}"
