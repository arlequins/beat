name: Deploy SST application

on:
  workflow_call:
    inputs:
      application:
        description: Workspace to deploy
        required: true
        type: string
      environment:
        description: GitHub environment and SST stage
        required: true
        type: string
      operation:
        description: diff, deploy, or remove
        required: true
        type: string
      role_arn:
        description: AWS IAM role assumed through GitHub OIDC
        required: true
        type: string
      runtime_secret_arn:
        description: Protected AWS Secrets Manager JSON secret ARN for the API Lambda
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SST_AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
    concurrency:
      group: sst-${{ inputs.environment }}-${{ inputs.application }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ env.SST_AWS_REGION }}

      - name: Validate operation
        run: |
          test "${{ inputs.operation }}" = diff || \
          test "${{ inputs.operation }}" = deploy || \
          test "${{ inputs.operation }}" = remove

      - name: Require Beat production runtime secret
        if: inputs.environment == 'production' && inputs.application == 'api' && inputs.operation != 'remove'
        env:
          RUNTIME_SECRET_ARN: ${{ inputs.runtime_secret_arn }}
        run: |
          test -n "$RUNTIME_SECRET_ARN"
          case "$RUNTIME_SECRET_ARN" in arn:aws:secretsmanager:*) ;; *) exit 1 ;; esac

      - name: Validate API runtime secret without exporting it
        if: inputs.environment == 'production' && inputs.application == 'api' && inputs.operation != 'remove' && inputs.runtime_secret_arn != ''
        env:
          RUNTIME_SECRET_ARN: ${{ inputs.runtime_secret_arn }}
        run: |
          secret_file="$RUNNER_TEMP/beat-api-runtime.json"
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_ARN" \
            --query SecretString \
            --output text > "$secret_file"
          BEAT_RUNTIME_SECRET_FILE="$secret_file" \
          node scripts/validate-beat-runtime-secret.mjs

      - name: Run SST operation
        env:
          BEAT_RUNTIME_SECRET_ARN: ${{ inputs.runtime_secret_arn }}
        run: |
          if test "${{ inputs.operation }}" = diff; then
            set -o pipefail
            pnpm sst:ws ${{ inputs.application }} diff -- --stage ${{ inputs.environment }} | tee "$RUNNER_TEMP/sst-diff.txt"
          else
            pnpm sst:ws ${{ inputs.application }} ${{ inputs.operation }} -- --stage ${{ inputs.environment }}
          fi

      - name: Save reviewed SST diff
        if: inputs.operation == 'diff'
        uses: actions/upload-artifact@v4
        with:
          name: sst-diff-${{ inputs.application }}-${{ github.sha }}
          path: ${{ runner.temp }}/sst-diff.txt
          if-no-files-found: error

      - name: Smoke production API
        if: inputs.application == 'api' && inputs.environment == 'production' && inputs.operation == 'deploy'
        env:
          API_URL: ${{ vars.BEAT_PRODUCTION_API_URL }}
        run: |
          test -n "$API_URL"
          node -e 'const url = new URL(process.argv[1]); if (url.protocol !== "https:") throw new Error("Production smoke endpoint must use HTTPS");' "$API_URL"
          node scripts/smoke-api.mjs "${API_URL%/}"
