name: Production deployment

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application to deploy
        required: true
        type: choice
        options: [api, web, batch]
      reviewed_commit:
        description: Exact main commit SHA reviewed in Production infrastructure diff
        required: true
        type: string
      bootstrap_api:
        description: One-time API infrastructure deploy to establish the generated issuer URL
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate-reviewed-diff:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
    steps:
      - name: Require a diff reviewed for this exact commit
        run: |
          test -n "$REVIEWED_COMMIT"
          test "$REVIEWED_COMMIT" = "$GITHUB_SHA"
          if test "${{ inputs.bootstrap_api }}" = true; then
            test "${{ inputs.application }}" = api
          fi

  deploy:
    needs: validate-reviewed-diff
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: ${{ inputs.application }}
      environment: production
      operation: deploy
      bootstrap_api: ${{ inputs.bootstrap_api }}
