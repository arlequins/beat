name: Production recovery readiness

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: beat-production-recovery-readiness
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SST_AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      SST_STAGE: production
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - name: Build API workspace dependencies
        run: pnpm turbo run build --filter=@arlequins/api...
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.SST_AWS_REGION }}
      - name: Resolve the private state bucket without exposing SST state
        run: |
          state_file="$RUNNER_TEMP/beat-api-sst-state.json"
          trap 'rm -f "$state_file"' EXIT
          SST_TELEMETRY_DISABLED=1 pnpm --silent --filter @arlequins/api with-env sst state export --stage production > "$state_file"
          echo "BEAT_AUTH_STATE_BUCKET=$(node scripts/read-sst-output.mjs "$state_file" authStateBucket)" >> "$GITHUB_ENV"
      - name: Check immutable recovery readiness
        run: pnpm --filter @arlequins/api auth:state:recovery:ready

  report-recovery:
    needs: readiness
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Close a recovered readiness issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Production recovery readiness warning"
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')"
          if test -n "$existing"; then gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Production recovery readiness recovered: $RUN_URL"; fi

  report-failure:
    needs: readiness
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open one actionable readiness issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Production recovery readiness warning"
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')"
          if test -z "$existing"; then gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The protected read-only recovery readiness check failed. Review the run without copying state keys or versions: $RUN_URL"; fi
