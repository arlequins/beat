name: Production smoke

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Production Beat API HTTPS origin
        required: true
        type: string

concurrency:
  group: beat-production-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Validate production URL
        id: endpoint
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          node -e 'const url = new URL(process.argv[1]); if (url.protocol !== "https:") throw new Error("Production smoke endpoint must use HTTPS");' "$API_URL"
          echo "url=${API_URL%/}" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: node scripts/smoke-api.mjs "${{ steps.endpoint.outputs.url }}"
