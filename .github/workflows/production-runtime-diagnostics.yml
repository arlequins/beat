name: Production API runtime diagnostics

on:
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: Failed Beat Production deployment run ID to diagnose
        required: true
        type: string
      confirm:
        description: Type production to acknowledge this protected operation
        required: true
        type: choice
        options: [production]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: beat-production-runtime-diagnostics
      cancel-in-progress: false
    env:
      CONFIRM: ${{ inputs.confirm }}
      DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      SST_AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup

      - name: Require a specific failed deployment
        run: |
          set -euo pipefail
          test "$CONFIRM" = production
          case "$DEPLOYMENT_RUN_ID" in
            *[!0-9]*|'') exit 1 ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.SST_AWS_REGION }}

      - name: Read redacted Lambda initialization diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_started_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOYMENT_RUN_ID" --jq '.run_started_at')"
          test -n "$run_started_at"
          start_time="$(date --date="$run_started_at - 5 minutes" +%s000)"
          end_time="$(date --date="$run_started_at + 20 minutes" +%s000)"
          mapfile -t log_groups < <(
            aws logs describe-log-groups \
              --log-group-name-prefix /aws/lambda/api-production- \
              --query 'logGroups[].logGroupName' \
              --output text | tr '\t' '\n'
          )
          test "${#log_groups[@]}" -gt 0
          for log_group in "${log_groups[@]}"; do
            output_file="$RUNNER_TEMP/$(basename "$log_group").json"
            umask 077
            aws logs filter-log-events \
              --log-group-name "$log_group" \
              --start-time "$start_time" \
              --end-time "$end_time" \
              --limit 200 \
              --output json > "$output_file"
            node scripts/print-lambda-runtime-diagnostics.mjs "$log_group" < "$output_file"
            rm -f "$output_file"
          done

      - name: Record diagnostic boundary
        run: |
          echo "### Production API runtime diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "Read only filtered Lambda events around deployment run \`$DEPLOYMENT_RUN_ID\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Event messages are redacted before output and are not uploaded as artifacts." >> "$GITHUB_STEP_SUMMARY"
