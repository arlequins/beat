name: ChatGPT Gourmet exporter release asset

on:
  push:
    tags: ["beat-v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package exporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package Chrome extension
        run: node scripts/package-chatgpt-beat-export.mjs
      - name: Wait for the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for attempt in $(seq 1 18); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "Release $RELEASE_TAG was not created in time" >&2
          exit 1
      - name: Upload exporter asset and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/chatgpt-beat-export/*.zip \
            dist/chatgpt-beat-export/*.zip.sha256 \
            --clobber
