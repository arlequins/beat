name: Production infrastructure diff

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application to plan from main
        required: true
        type: choice
        options: [api, web, batch]

permissions:
  contents: read
  id-token: write

jobs:
  diff:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: ${{ inputs.application }}
      environment: production
      operation: diff
      role_arn: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
      runtime_secret_arn: ${{ vars.BEAT_RUNTIME_SECRET_ARN }}
