name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3
  HUSKY: "0"
  NEXT_PUBLIC_BEAT_APP_URL: https://beat.invalid
  NEXT_PUBLIC_SITE_URL: https://portfolio.invalid

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - name: Check formatting
        run: pnpm format

  web:
    name: Static portfolio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - name: Lint the portfolio
        run: pnpm --filter @acme/web lint
      - name: Type-check the portfolio
        run: pnpm --filter @acme/web typecheck
      - name: Build all static pages
        run: pnpm turbo run build --filter=@acme/web...
