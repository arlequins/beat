name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3
  HUSKY: "0"
  NEXT_PUBLIC_BEAT_APP_URL: https://beat.invalid
  NEXT_PUBLIC_SITE_URL: https://portfolio.invalid

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - name: Check formatting
        run: pnpm format

  web:
    name: Static portfolio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - name: Lint the portfolio
        run: pnpm --filter @arlequins/web lint
      - name: Validate writing and translations
        run: pnpm content:check
      - name: Type-check the portfolio
        run: pnpm turbo run typecheck --filter=@arlequins/web...
      - name: Build all static pages
        run: pnpm turbo run build --filter=@arlequins/web...

  api-coverage:
    name: API coverage (75%)
    runs-on: ubuntu-latest
    env:
      DATABASE_HOST: localhost
      DATABASE_NAME: beat
      DATABASE_PASSWORD: test-password
      DATABASE_PORT: "5432"
      DATABASE_SSL_MODE: disable
      DATABASE_USER: postgres
      NEXT_PUBLIC_API_URL: https://api.invalid
      NEXT_PUBLIC_OIDC_AUTHORITY: https://api.invalid/auth
      NEXT_PUBLIC_OIDC_CLIENT_ID: beat-web
      NEXT_PUBLIC_OIDC_SCOPE: openid profile email
      OIDC_AUDIENCE: beat-agent
      OIDC_ISSUER_URL: https://api.invalid/auth
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - name: Build API workspace dependencies
        run: pnpm turbo run build --filter=@arlequins/api...
      - name: Enforce API coverage
        run: pnpm --filter @arlequins/api test:coverage
